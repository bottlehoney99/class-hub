<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HUB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  /* 레이아웃: 큰 컬러 워드마크 + 크기가 다른 벤토 타일 4개. 타일마다 눈이 커서를 따라가는 캐릭터 */
  :root {
    --bg: #f6f5fb;
    --fg: #17142a;
    --muted: #5f5a78;
    --edge: #17142a;
    --shadow: #17142a;
    --tile-ink: #17142a;
    --violet: #b9a6ff;
    --yellow: #ffd84d;
    --mint: #7ee0a6;
    --coral: #ff9a7a;
    --sky: #8fd3ff;
    --glass: rgba(255, 255, 255, .55);
    --font-display: "Fredoka", "Jua", system-ui, sans-serif;
    --font-title: "Jua", "Fredoka", "Apple SD Gothic Neo", sans-serif;
    --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15131f; --fg: #f1effa; --muted: #a9a4c4; --edge: #0b0a12; --shadow: #8b7cf6;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15131f; --fg: #f1effa; --muted: #a9a4c4; --edge: #0b0a12; --shadow: #8b7cf6;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.6;
    padding-block: 32px 48px;
    padding-inline: 16px;
    word-break: keep-all;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1040px; margin-inline: auto; display: flex; flex-direction: column; gap: 28px; }

  /* 상단 */
  header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
  h1 {
    margin: 0; font-family: var(--font-display); font-weight: 700;
    font-size: clamp(92px, 22vw, 200px); line-height: .85; letter-spacing: -0.02em;
    display: flex; gap: .02em;
  }
  h1 span {
    -webkit-text-stroke: 4px var(--edge); paint-order: stroke fill;
    text-shadow: 6px 6px 0 var(--shadow);
    display: inline-block; transition: transform .25s cubic-bezier(.3,1.6,.5,1);
  }
  h1 span:nth-child(1) { color: var(--violet); }
  h1 span:nth-child(2) { color: var(--yellow); }
  h1 span:nth-child(3) { color: var(--mint); }
  h1 span:hover { transform: translateY(-8px) rotate(-4deg); }
  .intro { display: flex; flex-direction: column; gap: 10px; padding-bottom: 8px; max-width: 320px; }
  .pill {
    align-self: flex-start; font-weight: 700; font-size: 14px;
    background: var(--coral); color: var(--tile-ink);
    border: 2.5px solid var(--edge); border-radius: 999px; padding: 4px 14px;
    box-shadow: 3px 3px 0 var(--shadow);
  }
  .intro p { margin: 0; color: var(--muted); font-size: 15px; }

  /* 벤토 */
  .bento { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
  .bento li { min-width: 0; display: flex; }
  .bento li:nth-child(1) { grid-column: span 2; grid-row: span 2; }
  .bento li:nth-child(2) { grid-column: span 2; }
  .bento li:nth-child(5) { grid-column: span 4; }
  @media (max-width: 820px) {
    .bento { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .bento li:nth-child(1) { grid-row: auto; }
    .bento li:nth-child(5) { grid-column: span 2; }
  }
  @media (max-width: 480px) {
    .bento { grid-template-columns: 1fr; }
    .bento li:nth-child(n) { grid-column: auto; }
  }

  a.tile {
    position: relative; flex: 1; min-width: 0;
    display: flex; flex-direction: column; gap: 10px;
    padding: 18px 18px 20px;
    color: var(--tile-ink); text-decoration: none;
    border: 3px solid var(--edge); border-radius: 26px;
    box-shadow: 6px 6px 0 var(--shadow);
    transition: transform .2s cubic-bezier(.3,1.4,.5,1), box-shadow .2s;
  }
  a.tile.t1 { background: var(--violet); }
  a.tile.t2 { background: var(--yellow); }
  a.tile.t3 { background: var(--mint); }
  a.tile.t4 { background: var(--coral); }
  a.tile.t5 { background: var(--sky); }
  a.tile:hover, a.tile:focus-visible { transform: translate(-3px, -3px); box-shadow: 10px 10px 0 var(--shadow); outline: none; }
  a.tile:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--shadow); }
  a.tile:focus-visible { outline: 3px dashed var(--fg); outline-offset: 5px; }

  .top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .no {
    font-family: var(--font-display); font-weight: 700; font-size: 14px;
    background: var(--tile-ink); color: #fff; border-radius: 999px; padding: 1px 10px;
  }
  .kind {
    font-size: 12px; font-weight: 700; letter-spacing: .02em;
    background: var(--glass); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    border: 2px solid var(--tile-ink); border-radius: 999px; padding: 1px 10px;
  }
  .bubble {
    position: absolute; top: 56px; right: 16px; z-index: 1;
    font-family: var(--font-title); font-size: 15px;
    background: #fff; color: var(--tile-ink);
    border: 2.5px solid var(--tile-ink); border-radius: 16px; padding: 4px 12px;
    opacity: 0; transform: translateY(6px) scale(.9); transform-origin: bottom right;
    transition: opacity .2s, transform .25s cubic-bezier(.3,1.6,.5,1);
    pointer-events: none; white-space: nowrap;
  }
  .bubble::after {
    content: ""; position: absolute; right: 22px; bottom: -8px; width: 12px; height: 12px;
    background: #fff; border-right: 2.5px solid var(--tile-ink); border-bottom: 2.5px solid var(--tile-ink);
    transform: rotate(45deg);
  }
  a.tile:hover .bubble, a.tile:focus-visible .bubble { opacity: 1; transform: none; }

  .char { width: 104px; height: 104px; margin: 4px auto 0; flex: none; display: block; }
  .t2 .char, .t5 .char { width: 124px; height: 124px; }
  .t1 .char { width: min(230px, 70%); height: auto; aspect-ratio: 1; margin-block: 12px; }
  .char .p { transition: transform .08s linear; }
  .char .eye { transform-box: fill-box; transform-origin: center; transition: transform .08s; }
  .char.blink .eye { transform: scaleY(.12); }
  a.tile:hover .char { animation: hop .55s cubic-bezier(.3,1.6,.5,1); }
  @keyframes hop { 0% { transform: translateY(0); } 40% { transform: translateY(-14px) rotate(-3deg); } 100% { transform: translateY(0); } }

  .bottom { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .name { font-family: var(--font-title); font-size: 24px; line-height: 1.2; min-width: 0; overflow-wrap: anywhere; }
  .t1 .name { font-size: clamp(28px, 4vw, 40px); }
  .go {
    flex: none; width: 44px; height: 44px; border-radius: 50%;
    background: var(--tile-ink); color: #fff; display: grid; place-items: center;
    transition: transform .25s cubic-bezier(.3,1.6,.5,1);
  }
  .go svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  a.tile:hover .go, a.tile:focus-visible .go { transform: rotate(45deg) scale(1.08); }

  footer { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: 13px; color: var(--muted); }
  footer kbd { font-family: var(--font-display); font-size: 12px; border: 2px solid currentColor; border-radius: 6px; padding: 0 6px; }
  @media (hover: none) { .keys { display: none; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>

<script>
(function () {
  "use strict";
  var tiles = Array.prototype.slice.call(document.querySelectorAll("a.tile"));
  var chars = Array.prototype.slice.call(document.querySelectorAll(".char"));
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* 숫자 키로 열기 */
  document.addEventListener("keydown", function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
    var i = parseInt(e.key, 10) - 1;
    if (tiles[i]) tiles[i].click();
  });

  if (reduce) return;

  /* 눈동자가 커서를 따라감 */
  var pupils = Array.prototype.slice.call(document.querySelectorAll(".char .p"));
  var mx = null, my = null, pending = false;
  function look() {
    pending = false;
    pupils.forEach(function (p) {
      var r = p.getBoundingClientRect();
      var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      var dx = mx - cx, dy = my - cy, d = Math.sqrt(dx * dx + dy * dy) || 1;
      var k = Math.min(1, d / 120) * 2.6;
      p.setAttribute("transform", "translate(" + (dx / d * k).toFixed(2) + " " + (dy / d * k).toFixed(2) + ")");
    });
  }
  function onMove(x, y) { mx = x; my = y; if (!pending) { pending = true; requestAnimationFrame(look); } }
  document.addEventListener("pointermove", function (e) { onMove(e.clientX, e.clientY); });
  document.addEventListener("pointerdown", function (e) { onMove(e.clientX, e.clientY); });

  /* 가끔 눈 깜빡임 */
  function blinkLater(c) {
    setTimeout(function () {
      c.classList.add("blink");
      setTimeout(function () { c.classList.remove("blink"); blinkLater(c); }, 140);
    }, 2200 + Math.random() * 4200);
  }
  chars.forEach(blinkLater);
})();
</script>
