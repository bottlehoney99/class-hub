<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HUB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
  /* 레이아웃: 제목 아래에 사이트 카드 4개를 한 줄에 하나(넓은 화면은 2열)로 배치 */
  :root {
    --bg: #eef1f5;
    --surface: #ffffff;
    --fg: #14202e;
    --muted: #5b6b7d;
    --line: #d5dce5;
    --accent: #1f5fbf;
    --accent-soft: #e2ecfa;
    --gh: #2b7a5a;
    --gh-soft: #dff2e9;
    --font-body: "IBM Plex Sans KR", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1620; --surface: #172230; --fg: #e6ecf3; --muted: #94a3b5; --line: #2a394b;
      --accent: #7aa9ee; --accent-soft: #1d3252; --gh: #6fcaa1; --gh-soft: #17362b;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1620; --surface: #172230; --fg: #e6ecf3; --muted: #94a3b5; --line: #2a394b;
    --accent: #7aa9ee; --accent-soft: #1d3252; --gh: #6fcaa1; --gh-soft: #17362b;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.6;
    padding-block: 40px 56px;
    padding-inline: 16px;
    word-break: keep-all;
  }
  .wrap { max-width: 880px; margin-inline: auto; display: flex; flex-direction: column; gap: 28px; }

  header { display: flex; flex-direction: column; gap: 6px; }
  .eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
  h1 { margin: 0; font-size: clamp(32px, 7vw, 48px); line-height: 1.1; font-weight: 700; letter-spacing: .02em; }
  .sub { margin: 0; color: var(--muted); }

  ul.list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 720px) { ul.list { grid-template-columns: 1fr 1fr; } }
  ul.list > li { min-width: 0; }

  .item {
    position: relative;
    display: grid; grid-template-columns: auto 1fr auto; gap: 4px 16px; align-items: center;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 18px; height: 100%;
  }
  .item:hover { border-color: var(--accent); }
  .item:hover .go { transform: translate(2px, -2px); color: var(--accent); }
  a.main { color: inherit; text-decoration: none; }
  a.main::after { content: ""; position: absolute; inset: 0; border-radius: 10px; }
  a.main:focus-visible { outline: none; }
  a.main:focus-visible::after { outline: 2px solid var(--accent); outline-offset: 2px; }

  .ico { grid-row: 1 / span 2; width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; }
  .ico.art { background: var(--accent-soft); color: var(--accent); }
  .ico.gh { background: var(--gh-soft); color: var(--gh); }
  .ico svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .name { font-size: 17px; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
  .go { grid-row: 1 / span 2; grid-column: 3; font-size: 18px; color: var(--muted); transition: transform .15s; }
  .meta { grid-column: 2; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-width: 0; }
  .tag { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; }
  .tag.art { background: var(--accent-soft); color: var(--accent); }
  .tag.gh { background: var(--gh-soft); color: var(--gh); }
  .host { font-family: var(--font-mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; min-width: 0; }

  footer { color: var(--muted); font-size: 13px; }
  @media (prefers-reduced-motion: reduce) { .go { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Algorithm Design Class</div>
    <h1>HUB</h1>
    <p class="sub">알고리즘 설계 수업에서 쓰는 사이트를 한곳에 모았습니다.</p>
  </header>

  <ul class="list">
    <li>
      <div class="item">
        <span class="ico gh" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="6" cy="5" r="2.5"/><circle cx="18" cy="12" r="2.5"/><circle cx="6" cy="19" r="2.5"/><path d="M8.2 6.2 15.8 10.8M8.2 17.8 15.8 13.2"/></svg></span>
        <span class="name"><a class="main" href="https://bottlehoney99.github.io/doc-algo/" target="_blank" rel="noopener noreferrer">알고리즘 설계 웹</a></span>
        <span class="go" aria-hidden="true">&#8599;</span>
        <span class="meta"><span class="tag gh">GitHub Pages</span><span class="host">bottlehoney99.github.io</span></span>
      </div>
    </li>
    <li>
      <div class="item">
        <span class="ico gh" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-7l-4.5 4v-4H6a2 2 0 0 1-2-2z"/><path d="M9.6 8.4a2.4 2.4 0 1 1 3.4 2.2c-.7.4-1 .8-1 1.6"/><path d="M12 14.2v.1"/></svg></span>
        <span class="name"><a class="main" href="https://bottlehoney99.github.io/class-quiz" target="_blank" rel="noopener noreferrer">양퀴즈</a></span>
        <span class="go" aria-hidden="true">&#8599;</span>
        <span class="meta"><span class="tag gh">GitHub Pages</span><span class="host">bottlehoney99.github.io</span></span>
      </div>
    </li>
    <li>
      <div class="item">
        <span class="ico gh" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 7 3 12l5 5"/><path d="M16 7l5 5-5 5"/><path d="M9.5 12.5l2 2 3.5-4"/></svg></span>
        <span class="name"><a class="main" href="https://bottlehoney99.github.io/code-review" target="_blank" rel="noopener noreferrer">코드 채점실</a></span>
        <span class="go" aria-hidden="true">&#8599;</span>
        <span class="meta"><span class="tag gh">GitHub Pages</span><span class="host">bottlehoney99.github.io</span></span>
      </div>
    </li>
    <li>
      <div class="item">
        <span class="ico art" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M8.5 15l2.2 2.2 4.3-4.4"/></svg></span>
        <span class="name"><a class="main" href="https://claude.ai/artifact/4RFLaqJ3BWsC2V5etnVevr" target="_blank" rel="noopener noreferrer">1학년 자격증 일정</a></span>
        <span class="go" aria-hidden="true">&#8599;</span>
        <span class="meta"><span class="tag art">아티팩트</span><span class="host">claude.ai</span></span>
      </div>
    </li>
  </ul>

  <footer>총 4개</footer>
</div>
</body>
</html>
