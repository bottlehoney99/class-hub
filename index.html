<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HUB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;400;600&family=Noto+Sans+KR:wght@300;400;500&display=swap">
<style>
  /* 레이아웃: 얇고 큰 워드마크, 그 아래 사이트를 한 줄씩 크게 놓은 목록. 커서를 따라다니는 작은 주소 표시 */
  :root {
    --bg: #f2f3f5;
    --fg: #121419;
    --muted: #70747e;
    --line: #d9dbe1;
    --accent: #3a4fd8;
    --wash: #e6e9f6;
    --chip-bg: #121419;
    --chip-fg: #f2f3f5;
    --font-latin: "Manrope", "Noto Sans KR", system-ui, sans-serif;
    --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e0f12; --fg: #ececef; --muted: #8a8e98; --line: #262830;
      --accent: #8ea0ff; --wash: #181b28; --chip-bg: #ececef; --chip-fg: #0e0f12;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e0f12; --fg: #ececef; --muted: #8a8e98; --line: #262830;
    --accent: #8ea0ff; --wash: #181b28; --chip-bg: #ececef; --chip-fg: #0e0f12;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-weight: 400;
    font-size: 15px;
    line-height: 1.6;
    padding-block: clamp(32px, 7vw, 72px) 48px;
    padding-inline: 16px;
    word-break: keep-all;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1040px; margin-inline: auto; display: flex; flex-direction: column; gap: clamp(36px, 7vw, 72px); }

  header { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 16px; }
  h1 {
    margin: 0; font-family: var(--font-latin); font-weight: 200;
    font-size: clamp(76px, 19vw, 200px); line-height: .82; letter-spacing: -0.045em;
  }
  .about { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; padding-bottom: 6px; text-align: right; }
  .about .course { font-size: 15px; font-weight: 500; }
  .about .count { font-family: var(--font-latin); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  @media (max-width: 520px) {
    header { grid-template-columns: 1fr; }
    .about { align-items: flex-start; text-align: left; padding-bottom: 0; }
  }

  ul.links { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  ul.links li { border-bottom: 1px solid var(--line); }
  a.row {
    position: relative; isolation: isolate; overflow: hidden;
    display: grid; grid-template-columns: 56px minmax(0, 1fr) auto 48px; align-items: center; gap: 16px;
    padding: clamp(18px, 3vw, 28px) 4px;
    color: inherit; text-decoration: none;
  }
  a.row::before {
    content: ""; position: absolute; inset: 0; z-index: -1; background: var(--wash);
    transform: scaleY(0); transform-origin: bottom; transition: transform .45s cubic-bezier(.2,.7,.1,1);
  }
  a.row:hover::before, a.row:focus-visible::before { transform: scaleY(1); }
  a.row:focus-visible { outline: none; }
  .idx { font-family: var(--font-latin); font-weight: 400; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; padding-left: 8px; }
  .name {
    font-weight: 300; font-size: clamp(26px, 5vw, 46px); line-height: 1.15; letter-spacing: -0.025em;
    min-width: 0; overflow-wrap: anywhere;
    transition: transform .45s cubic-bezier(.2,.7,.1,1), color .3s;
  }
  a.row:hover .name, a.row:focus-visible .name { transform: translateX(10px); color: var(--accent); }
  .kind { font-family: var(--font-latin); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .arrow {
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line);
    display: grid; place-items: center; justify-self: end; margin-right: 4px;
    transition: background .3s, border-color .3s, color .3s;
  }
  .arrow svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; transform: rotate(-45deg); transition: transform .45s cubic-bezier(.2,.7,.1,1); }
  a.row:hover .arrow, a.row:focus-visible .arrow { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  a.row:hover .arrow svg, a.row:focus-visible .arrow svg { transform: rotate(0deg); }
  @media (max-width: 600px) {
    a.row { grid-template-columns: 36px minmax(0, 1fr) 44px; gap: 10px; }
    .kind { grid-column: 2; grid-row: 2; margin-top: -6px; }
    .arrow { grid-column: 3; grid-row: 1 / span 2; width: 40px; height: 40px; }
    .idx { padding-left: 4px; }
  }

  footer { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  footer kbd { font-family: var(--font-latin); font-size: 12px; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
  @media (hover: none) { .keys { display: none; } }

  .chip {
    position: fixed; left: 0; top: 0; z-index: 10; pointer-events: none;
    background: var(--chip-bg); color: var(--chip-fg);
    font-family: var(--font-latin); font-size: 12px; letter-spacing: .01em;
    padding: 6px 12px; border-radius: 999px; white-space: nowrap;
    opacity: 0; transform: translate3d(-100px, -100px, 0);
    transition: opacity .2s;
  }
  .chip.show { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before { transition: none !important; }
    .chip { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>HUB</h1>
    <div class="about">
      <span class="course">알고리즘 설계 수업</span>
      <span class="count">04 LINKS</span>
    </div>
  </header>

  <ul class="links">
    <li><a class="row" href="https://bottlehoney99.github.io/doc-algo/" target="_blank" rel="noopener noreferrer" data-host="bottlehoney99.github.io/doc-algo">
      <span class="idx">01</span><span class="name">알고리즘 설계 웹</span><span class="kind">GitHub Pages</span>
      <span class="arrow" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span>
    </a></li>
    <li><a class="row" href="https://bottlehoney99.github.io/class-quiz" target="_blank" rel="noopener noreferrer" data-host="bottlehoney99.github.io/class-quiz">
      <span class="idx">02</span><span class="name">양퀴즈</span><span class="kind">GitHub Pages</span>
      <span class="arrow" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span>
    </a></li>
    <li><a class="row" href="https://bottlehoney99.github.io/code-review" target="_blank" rel="noopener noreferrer" data-host="bottlehoney99.github.io/code-review">
      <span class="idx">03</span><span class="name">파이썬 실험실</span><span class="kind">GitHub Pages</span>
      <span class="arrow" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span>
    </a></li>
    <li><a class="row" href="https://claude.ai/artifact/4RFLaqJ3BWsC2V5etnVevr" target="_blank" rel="noopener noreferrer" data-host="claude.ai/artifact">
      <span class="idx">04</span><span class="name">자격증 일정</span><span class="kind">Artifact</span>
      <span class="arrow" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span>
    </a></li>
  </ul>

  <footer>
    <span>알고리즘 설계 · 링크 모음</span>
    <span class="keys"><kbd>1</kbd>–<kbd>4</kbd> 키로 바로 열기</span>
  </footer>
</div>

<div class="chip" id="chip" aria-hidden="true"></div>

<script>
(function () {
  "use strict";
  var rows = Array.prototype.slice.call(document.querySelectorAll("a.row"));

  /* 숫자 키로 열기 */
  document.addEventListener("keydown", function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
    var i = parseInt(e.key, 10) - 1;
    if (rows[i]) rows[i].click();
  });

  /* 커서를 따라다니는 주소 표시 (마우스가 있는 환경에서만) */
  var fine = window.matchMedia && window.matchMedia("(hover: hover) and (pointer: fine)").matches;
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!fine || reduce) return;
  var chip = document.getElementById("chip");
  var tx = -100, ty = -100, x = -100, y = -100, running = false;
  function place() { chip.style.transform = "translate3d(" + (x + 18) + "px," + (y + 14) + "px,0)"; }
  function tick() {
    x += (tx - x) * 0.18; y += (ty - y) * 0.18;
    place();
    if (Math.abs(tx - x) > 0.3 || Math.abs(ty - y) > 0.3) requestAnimationFrame(tick); else running = false;
  }
  document.addEventListener("mousemove", function (e) {
    tx = e.clientX; ty = e.clientY;
    if (!running) { running = true; requestAnimationFrame(tick); }
  });
  rows.forEach(function (r) {
    r.addEventListener("mouseenter", function (e) {
      chip.textContent = r.getAttribute("data-host") + " ↗";
      if (!chip.classList.contains("show")) { x = tx = e.clientX; y = ty = e.clientY; place(); }
      chip.classList.add("show");
    });
    r.addEventListener("mouseleave", function () { chip.classList.remove("show"); });
  });
})();
</script>
</body>
</html>
